name: Update bank holidays

# Checks GOV.UK every week and opens a pull request when the list of bank
# holidays changes, for example when a new year is added or a one-off holiday
# is announced.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Download the latest list
        run: go generate ./...

      - name: Run tests
        run: go test ./...

      - name: Open a pull request if the list changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Bank holidays unchanged."
            exit 0
          fi
          branch=update-bank-holidays
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Update bank holidays from GOV.UK"
          git push --force origin "$branch"
          if ! gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr create --head "$branch" \
              --title "Update bank holidays from GOV.UK" \
              --body "GOV.UK's list of bank holidays has changed. Check the diff, add a CHANGELOG entry, then close and reopen this pull request so the checks run (pull requests opened by GitHub Actions don't start them)."
          fi
